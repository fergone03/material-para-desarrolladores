    # ── Material para desarrolladores (/material-para-desarrolladores) ───────
    # Frontend React en /var/www/ctl/material-para-desarrolladores/dist.
    # /api/: GoTrue (auth) y PostgREST (rest) sobre Postgres,
    # ver material-para-desarrolladores-{auth,rest}.service.
    location /material-para-desarrolladores/api/auth/v1/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location /material-para-desarrolladores/api/rest/v1/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /material-para-desarrolladores {
        return 301 /material-para-desarrolladores/;
    }

    location /material-para-desarrolladores/assets/ {
        alias /var/www/ctl/material-para-desarrolladores/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /material-para-desarrolladores/ {
        alias /var/www/ctl/material-para-desarrolladores/dist/;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /material-para-desarrolladores/index.html;
    }

